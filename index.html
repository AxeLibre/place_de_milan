<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Place de Milan — Extensions du hall</title>
<style>
  body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #101820; }
  canvas { display: block; }
  
  /* Interface minimaliste */
  #ui {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(16,24,32,0.9);
    border: 1px solid #2a3946;
    border-radius: 8px;
    padding: 12px 20px;
    display: flex;
    gap: 12px;
    align-items: center;
    backdrop-filter: blur(6px);
    pointer-events: none;
    z-index: 10;
  }
  #ui > * { pointer-events: auto; }
  
  .btn {
    background: #182430;
    border: 1px solid #2a3946;
    color: #eef1ee;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
  }
  .btn:hover { border-color: #5b8ab0; }
  .btn.active { background: #e0663f; border-color: #e0663f; color: #1a0e08; font-weight: 600; }
  .btn.primary { background: #4fae8f; border-color: #4fae8f; color: #101820; }
  
  #status {
    color: #7f93a3;
    font-size: 12px;
    font-family: monospace;
    min-width: 200px;
  }
  #status b { color: #e0663f; }
  
  #info {
    position: absolute;
    top: 20px;
    right: 20px;
    color: #7f93a3;
    font-size: 11px;
    font-family: monospace;
    text-align: right;
    line-height: 1.6;
    z-index: 10;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="info">
  <div>🖱 Clic gauche : placer/déplacer un pivot</div>
  <div>🔄 Molette : zoom</div>
  <div>✋ Clic droit : orbiter</div>
</div>

<div id="ui">
  <button class="btn" id="btn-draw">➕ Tracer une extension</button>
  <button class="btn" id="btn-finish" disabled>✅ Valider</button>
  <button class="btn" id="btn-cancel" disabled>✖ Annuler</button>
  <span id="status">💡 Cliquez sur le sol pour placer les pivots</span>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

// ============================================================
// SCENE
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101820);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(80, 60, 100);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.prepend(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.48;

// Lights
scene.add(new THREE.HemisphereLight(0xdfe8ef, 0x1a1f24, 0.8));
const sun = new THREE.DirectionalLight(0xfff2df, 1.2);
sun.position.set(80, 150, 60);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -100; sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100; sun.shadow.camera.bottom = -100;
sun.shadow.camera.far = 300;
scene.add(sun);

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(300, 300),
  new THREE.MeshStandardMaterial({ color: 0x1b2731, roughness: 1 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
ground.position.y = -0.5;
scene.add(ground);

// Grid
const grid = new THREE.GridHelper(200, 40, 0x2a3946, 0x1a242d);
grid.position.y = -0.45;
scene.add(grid);

// ============================================================
// MAQUETTE (hall de gare simplifié)
// ============================================================
const hallGroup = new THREE.Group();
hallGroup.position.set(-10, 0, -25);

const hallMat = new THREE.MeshStandardMaterial({ color: 0x8fa4b3, roughness: 0.5, metalness: 0.1 });
const hallW = 30, hallD = 22, hallH = 8;

// Base
const base = new THREE.Mesh(new THREE.BoxGeometry(hallW, hallH, hallD), hallMat);
base.position.y = hallH/2;
base.castShadow = true; base.receiveShadow = true;
hallGroup.add(base);

// Toit arrondi
const roofGeo = new THREE.CylinderGeometry(hallW/2, hallW/2, hallD, 24, 1, false, 0, Math.PI);
const roof = new THREE.Mesh(roofGeo, hallMat);
roof.rotation.z = Math.PI/2;
roof.rotation.y = Math.PI/2;
roof.position.y = hallH;
roof.castShadow = true; roof.receiveShadow = true;
hallGroup.add(roof);

scene.add(hallGroup);

// Contour du hall pour visibilité
const edgeMat = new THREE.LineBasicMaterial({ color: 0x5b8ab0, transparent: true, opacity: 0.3 });
const edgeGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(hallW, hallH, hallD));
const edgeLine = new THREE.LineSegments(edgeGeo, edgeMat);
edgeLine.position.y = hallH/2;
hallGroup.add(edgeLine);

// ============================================================
// SYSTÈME D'EXTENSION À PIVOTS 3D
// ============================================================
let pivots = [];           // [{position:Vector3, mesh, heightLine}]
let pivotGroup = new THREE.Group();
scene.add(pivotGroup);

let extensionMeshes = [];  // [{group, pivots:[Vector3], mesh}]
let extIdCounter = 1;

let drawing = false;
let selectedPivot = null;

const btnDraw = document.getElementById('btn-draw');
const btnFinish = document.getElementById('btn-finish');
const btnCancel = document.getElementById('btn-cancel');
const statusEl = document.getElementById('status');

// Raycaster
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

// Fonction pour obtenir le point au sol
function getGroundPoint(event) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(ground);
  return hits.length ? hits[0].point : null;
}

// Fonction pour obtenir un pivot existant par clic
function getPivotAt(event) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  
  const pivotMeshes = pivots.map(p => p.mesh);
  const hits = raycaster.intersectObjects(pivotMeshes);
  if (hits.length) {
    const hitMesh = hits[0].object;
    return pivots.find(p => p.mesh === hitMesh) || null;
  }
  return null;
}

// Créer un pivot
function createPivot(position) {
  const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(0.6, 16, 16),
    new THREE.MeshStandardMaterial({ color: 0xe0663f, emissive: 0xe0663f, emissiveIntensity: 0.2 })
  );
  sphere.position.copy(position);
  sphere.position.y = position.y || 0.2;
  sphere.castShadow = true;
  pivotGroup.add(sphere);
  
  // Ligne de hauteur
  const lineMat = new THREE.LineBasicMaterial({ color: 0xe0663f, transparent: true, opacity: 0.3 });
  const lineGeo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(sphere.position.x, -0.4, sphere.position.z),
    sphere.position.clone()
  ]);
  const line = new THREE.Line(lineGeo, lineMat);
  pivotGroup.add(line);
  
  const pivot = { position: sphere.position.clone(), mesh: sphere, heightLine: line };
  pivots.push(pivot);
  
  updateUI();
  return pivot;
}

// Supprimer le dernier pivot (annuler)
function popPivot() {
  if (pivots.length === 0) return;
  const last = pivots.pop();
  pivotGroup.remove(last.mesh);
  pivotGroup.remove(last.heightLine);
  updateUI();
}

// Mettre à jour la ligne de hauteur d'un pivot
function updateHeightLine(pivot) {
  const pos = pivot.mesh.position;
  const pts = [new THREE.Vector3(pos.x, -0.4, pos.z), pos.clone()];
  pivot.heightLine.geometry.dispose();
  pivot.heightLine.geometry = new THREE.BufferGeometry().setFromPoints(pts);
}

// Mettre à jour la courbe de l'extension (ligne reliant les pivots)
function updateCurve() {
  // Supprimer l'ancienne ligne
  pivotGroup.children.forEach(child => {
    if (child.isLine && child !== pivots[0]?.heightLine && child !== pivots[0]?.mesh) {
      // On garde les lignes de hauteur, on supprime les courbes
    }
  });
  
  const curveLines = [];
  pivotGroup.children.forEach(child => {
    if (child.isLine && child !== pivots[0]?.heightLine) {
      curveLines.push(child);
    }
  });
  curveLines.forEach(l => pivotGroup.remove(l));
  
  if (pivots.length < 2) return;
  
  // Créer une courbe CatmullRom en 3D
  const points = pivots.map(p => p.mesh.position.clone());
  const curve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.3);
  const curvePoints = curve.getPoints(50);
  
  const lineMat = new THREE.LineBasicMaterial({ color: 0x4fae8f, linewidth: 2 });
  const lineGeo = new THREE.BufferGeometry().setFromPoints(curvePoints);
  const line = new THREE.Line(lineGeo, lineMat);
  pivotGroup.add(line);
  
  // Ajouter des repères d'orientation (petites flèches)
  for (let i = 0; i < points.length - 1; i++) {
    const p1 = points[i];
    const p2 = points[i+1];
    const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
    const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
    // Petite flèche directionnelle
    const arrowLen = 1.2;
    const arrowColor = 0x4fae8f;
    const arrow = new THREE.ArrowHelper(dir, mid, arrowLen, arrowColor, 0.5, 0.3);
    pivotGroup.add(arrow);
  }
}

// Valider l'extension → créer la géométrie loftée
function finishExtension() {
  if (pivots.length < 2) {
    statusEl.innerHTML = '⚠️ Il faut au moins 2 pivots pour créer une extension';
    return;
  }
  
  // Créer le profil : on prend la section du hall
  // Pour simplifier, on crée un rectangle de 10x8 qui suit la courbe
  const points = pivots.map(p => p.mesh.position.clone());
  const curve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.3);
  const segments = 30;
  const profileWidth = 6;
  const profileHeight = 6;
  
  // Générer la géométrie loftée
  const positions = [];
  const indices = [];
  const profilePoints = [
    new THREE.Vector3(-profileWidth/2, -profileHeight/2, 0),
    new THREE.Vector3(profileWidth/2, -profileHeight/2, 0),
    new THREE.Vector3(profileWidth/2, profileHeight/2, 0),
    new THREE.Vector3(-profileWidth/2, profileHeight/2, 0)
  ];
  const profileLen = profilePoints.length;
  
  for (let s = 0; s <= segments; s++) {
    const t = s / segments;
    const center = curve.getPointAt(t);
    const tangent = curve.getTangentAt(t);
    const up = new THREE.Vector3(0, 1, 0);
    const right = new THREE.Vector3().crossVectors(tangent, up).normalize();
    const localUp = new THREE.Vector3().crossVectors(right, tangent).normalize();
    
    for (const pp of profilePoints) {
      const pt = center.clone()
        .add(right.clone().multiplyScalar(pp.x))
        .add(localUp.clone().multiplyScalar(pp.y));
      positions.push(pt.x, pt.y, pt.z);
    }
  }
  
  for (let s = 0; s < segments; s++) {
    for (let i = 0; i < profileLen; i++) {
      const a = s * profileLen + i;
      const b = s * profileLen + ((i + 1) % profileLen);
      const c = (s + 1) * profileLen + i;
      const d = (s + 1) * profileLen + ((i + 1) % profileLen);
      indices.push(a, c, b, b, c, d);
    }
  }
  
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  
  const mat = new THREE.MeshStandardMaterial({
    color: 0x9fb8c4,
    roughness: 0.5,
    metalness: 0.1,
    transparent: true,
    opacity: 0.85,
    side: THREE.DoubleSide
  });
  
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  
  // Sauvegarder
  const ext = {
    id: extIdCounter++,
    pivots: points.map(p => p.clone()),
    mesh: mesh,
    group: new THREE.Group()
  };
  ext.group.add(mesh);
  extensionMeshes.push(ext);
  
  // Nettoyer les pivots
  clearPivots();
  statusEl.innerHTML = `✅ Extension ${ext.id} créée avec ${points.length} pivots`;
  updateUI();
}

// Effacer les pivots (sans supprimer l'extension)
function clearPivots() {
  pivots.forEach(p => {
    pivotGroup.remove(p.mesh);
    pivotGroup.remove(p.heightLine);
  });
  pivots = [];
  // Nettoyer les lignes restantes
  const toRemove = [];
  pivotGroup.children.forEach(c => {
    if (c.isLine || c.isArrowHelper) toRemove.push(c);
  });
  toRemove.forEach(c => pivotGroup.remove(c));
}

// Supprimer une extension
function deleteExtension(id) {
  const idx = extensionMeshes.findIndex(e => e.id === id);
  if (idx === -1) return;
  const ext = extensionMeshes[idx];
  scene.remove(ext.mesh);
  ext.mesh.geometry.dispose();
  ext.mesh.material.dispose();
  extensionMeshes.splice(idx, 1);
  updateUI();
}

// ============================================================
// INTERFACE UTILISATEUR
// ============================================================
function updateUI() {
  btnFinish.disabled = pivots.length < 2;
  btnCancel.disabled = pivots.length === 0 && !drawing;
  
  if (drawing) {
    statusEl.innerHTML = `✏️ ${pivots.length} pivot${pivots.length > 1 ? 's' : ''} · cliquez pour ajouter · entrez pour valider`;
  } else {
    const count = extensionMeshes.length;
    statusEl.innerHTML = count ? `🏗️ ${count} extension${count > 1 ? 's' : ''} créée${count > 1 ? 's' : ''} · cliquez sur un pivot pour le déplacer` : '💡 Cliquez sur "Tracer" pour commencer';
  }
}

// Démarrer le tracé
function startDrawing() {
  drawing = true;
  clearPivots();
  btnDraw.classList.add('active');
  btnDraw.textContent = '✏️ Tracé en cours';
  btnFinish.disabled = true;
  btnCancel.disabled = false;
  controls.enabled = false;
  updateUI();
}

// Annuler le tracé
function cancelDrawing() {
  drawing = false;
  clearPivots();
  btnDraw.classList.remove('active');
  btnDraw.textContent = '➕ Tracer une extension';
  btnFinish.disabled = true;
  btnCancel.disabled = true;
  controls.enabled = true;
  updateUI();
}

// Événements souris
renderer.domElement.addEventListener('click', (event) => {
  if (!drawing) {
    // En mode édition, cliquer sur un pivot pour le sélectionner et le déplacer
    const pivot = getPivotAt(event);
    if (pivot) {
      selectedPivot = pivot;
      statusEl.innerHTML = `🔵 Pivot sélectionné · cliquez sur le sol pour le déplacer en hauteur`;
      return;
    }
    return;
  }
  
  // En mode tracé : ajouter un pivot
  const pt = getGroundPoint(event);
  if (!pt) return;
  
  // Hauteur par défaut : 2m au-dessus du sol
  pt.y = 2.0;
  createPivot(pt);
  updateCurve();
  updateUI();
});

// Déplacement du pivot sélectionné (clic sur le sol)
renderer.domElement.addEventListener('dblclick', (event) => {
  if (!selectedPivot) return;
  const pt = getGroundPoint(event);
  if (!pt) return;
  
  // Déplacer le pivot en hauteur (Y)
  const oldY = selectedPivot.mesh.position.y;
  selectedPivot.mesh.position.y = pt.y;
  updateHeightLine(selectedPivot);
  updateCurve();
  statusEl.innerHTML = `📐 Hauteur du pivot : ${pt.y.toFixed(1)}m`;
  selectedPivot = null;
});

// Clavier
window.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && drawing) {
    finishExtension();
    cancelDrawing();
  }
  if (event.key === 'Escape') {
    if (drawing) cancelDrawing();
    selectedPivot = null;
  }
  if (event.key === 'Backspace' && drawing) {
    popPivot();
    updateCurve();
  }
  if (event.key === 'Delete' && !drawing) {
    // Supprimer l'extension sélectionnée (au clic)
    // Pour simplifier, on supprime la dernière
    if (extensionMeshes.length) {
      deleteExtension(extensionMeshes[extensionMeshes.length - 1].id);
    }
  }
});

// Boutons
btnDraw.addEventListener('click', () => {
  if (drawing) {
    cancelDrawing();
  } else {
    startDrawing();
  }
});

btnFinish.addEventListener('click', () => {
  if (drawing) {
    finishExtension();
    cancelDrawing();
  }
});

btnCancel.addEventListener('click', cancelDrawing);

// ============================================================
// RENDU
// ============================================================
function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', resize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// Status initial
updateUI();

console.log('🚀 Extension avec pivots 3D prête !');
console.log('💡 Tracer : cliquez au sol pour placer des pivots (hauteur automatique 2m)');
console.log('💡 Modifier : double-cliquez sur un pivot pour changer sa hauteur');
console.log('💡 Entrée : valider · Échap : annuler · Suppr : supprimer la dernière extension');
</script>
</body>
</html>

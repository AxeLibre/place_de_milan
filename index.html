<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Place de Milan — Extension du hall</title>
<style>
  /* ===== STYLES COMPLETS ===== */
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#101820;color:#eef1ee;font-family:'Inter',sans-serif;overflow:hidden;height:100vh;}
  #app{display:flex;height:100vh;}

  #viewport{flex:1;position:relative;background:#101820;}
  #viewport canvas{display:block;width:100%;height:100%;}

  #panel{
    width:350px;
    background:#182430;
    border-left:1px solid #2a3946;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    flex-shrink:0;
  }
  #panel-scroll{flex:1;overflow-y:auto;padding:16px;}
  #panel-scroll::-webkit-scrollbar{width:6px;}
  #panel-scroll::-webkit-scrollbar-thumb{background:#2a3946;border-radius:3px;}

  .section-title{
    font-family:'Segoe UI',sans-serif;
    font-size:12px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:#7f93a3;
    margin:20px 0 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-title::after{content:"";flex:1;height:1px;background:#2a3946;}

  .field{margin-bottom:10px;}
  .field label{display:block;font-size:11px;color:#7f93a3;margin-bottom:3px;font-family:'Courier New',monospace;}
  .field input[type=text], .field input[type=number]{
    width:100%;
    background:#0b1116;
    border:1px solid #2a3946;
    color:#eef1ee;
    padding:6px 8px;
    border-radius:3px;
    font-size:13px;
  }
  .field input:focus{outline:none;border-color:#5b8ab0;}

  .row{display:flex;gap:8px;}
  .row .field{flex:1;}

  .btn{
    background:#2a3946;
    border:none;
    color:#eef1ee;
    padding:8px 14px;
    border-radius:3px;
    cursor:pointer;
    font-size:13px;
    transition:all 0.15s;
    font-family:'Segoe UI',sans-serif;
  }
  .btn:hover{background:#3f5568;}
  .btn-primary{background:#4fae8f;color:#101820;}
  .btn-primary:hover{background:#5fc09f;}
  .btn-danger{background:#d95a6c;color:#fff;}
  .btn-danger:hover{background:#e06a7c;}
  .btn-sm{font-size:11px;padding:4px 10px;}

  .bldg-card{
    background:#0b1116;
    border:1px solid #2a3946;
    border-radius:4px;
    margin-bottom:8px;
    overflow:hidden;
  }
  .bldg-card.selected{border-color:#e0663f;}
  .bldg-head{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 10px;
    cursor:pointer;
  }
  .bldg-head .name{flex:1;font-weight:600;font-size:13px;}
  .bldg-head .badge{font-size:10px;color:#7f93a3;background:#1a242d;padding:2px 8px;border-radius:10px;}

  .bldg-body{padding:0 10px 12px;border-top:1px solid #1a242d;display:none;}
  .bldg-body.open{display:block;}

  .mini-btn{
    background:none;
    border:1px solid #2a3946;
    color:#7f93a3;
    border-radius:3px;
    width:24px;height:24px;
    cursor:pointer;
    font-size:13px;
    line-height:1;
    transition:all 0.12s;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }
  .mini-btn:hover{color:#eef1ee;border-color:#5b8ab0;}
  .mini-btn.danger:hover{border-color:#d95a6c;color:#d95a6c;}
  .mini-btn.success:hover{border-color:#4fae8f;color:#4fae8f;}

  #status-bar{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:#0b1116;
    border:1px solid #2a3946;
    border-radius:4px;
    padding:8px 16px;
    font-size:12px;
    font-family:'Courier New',monospace;
    color:#7f93a3;
    z-index:10;
    pointer-events:none;
    display:flex;
    gap:16px;
    align-items:center;
  }
  #status-bar .highlight{color:#e0663f;font-weight:600;}

  #ext-edit-controls{
    background:#0b1116;
    border:1px solid #4fae8f;
    border-radius:4px;
    padding:12px;
    margin-bottom:12px;
  }
  #ext-edit-controls .row{display:flex;gap:6px;align-items:center;margin:4px 0;flex-wrap:wrap;}
  #ext-edit-controls label{font-size:10px;color:#7f93a3;font-family:'Courier New',monospace;}
  #ext-edit-controls input[type=number]{width:48px;background:#101820;border:1px solid #2a3946;color:#eef1ee;border-radius:3px;padding:2px 4px;font-size:11px;}
  #ext-edit-controls .btn-group{display:flex;gap:6px;margin-top:8px;}

  .empty-note{color:#7f93a3;font-size:12px;line-height:1.6;font-family:'Courier New',monospace;}

  #compass{
    position:absolute;
    top:16px;
    right:16px;
    width:40px;height:40px;
    background:#182430;
    border:1px solid #2a3946;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:700;
    color:#e0663f;
    z-index:5;
    pointer-events:none;
  }
</style>
</head>
<body>
<div id="app">
  <div id="viewport">
    <div id="status-bar">
      <span id="status-text">💡 Cliquez sur « Nouvelle extension » pour commencer</span>
      <span id="status-pivots" class="highlight"></span>
    </div>
    <div id="compass">N↑</div>
  </div>

  <div id="panel">
    <div id="panel-scroll">
      <div class="section-title">📍 Extensions du hall</div>
      <div id="ext-empty" class="empty-note">Aucune extension. Cliquez sur <b style="color:#eef1ee">Nouvelle extension</b> puis sur la façade du hall.</div>
      <div id="ext-list"></div>

      <div class="section-title">⚙️ Actions</div>
      <button class="btn btn-primary" id="btn-new-ext" style="width:100%;">➕ Nouvelle extension</button>
      <button class="btn" id="btn-cancel-ext" style="width:100%;margin-top:6px;display:none;">✖ Annuler</button>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

// ============================================================
// SCENE
// ============================================================
const viewport = document.getElementById('viewport');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101820);

const camera = new THREE.PerspectiveCamera(40, viewport.clientWidth/viewport.clientHeight, 0.1, 1000);
camera.position.set(70, 50, 90);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setSize(viewport.clientWidth, viewport.clientHeight);
viewport.prepend(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.48;

// Lights
scene.add(new THREE.HemisphereLight(0xdfe8ef, 0x1a1f24, 0.8));
const sun = new THREE.DirectionalLight(0xfff2df, 1.2);
sun.position.set(80, 150, 60);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -100; sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100; sun.shadow.camera.bottom = -100;
sun.shadow.camera.far = 300;
scene.add(sun);

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(300, 300),
  new THREE.MeshStandardMaterial({ color: 0x1b2731, roughness: 1 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
ground.position.y = -0.5;
scene.add(ground);

// Grid
const grid = new THREE.GridHelper(200, 40, 0x2a3946, 0x1a242d);
grid.position.y = -0.45;
scene.add(grid);

// ============================================================
// HALL DE GARE (maquette)
// ============================================================
const hallGroup = new THREE.Group();
hallGroup.position.set(-10, 0, -25);
const hallMat = new THREE.MeshStandardMaterial({ color: 0x8fa4b3, roughness: 0.5, metalness: 0.1 });
const hallW = 30, hallD = 22, hallH = 8;

const base = new THREE.Mesh(new THREE.BoxGeometry(hallW, hallH, hallD), hallMat);
base.position.y = hallH/2;
base.castShadow = true; base.receiveShadow = true;
hallGroup.add(base);

const roofGeo = new THREE.CylinderGeometry(hallW/2, hallW/2, hallD, 24, 1, false, 0, Math.PI);
const roof = new THREE.Mesh(roofGeo, hallMat);
roof.rotation.z = Math.PI/2;
roof.rotation.y = Math.PI/2;
roof.position.y = hallH;
roof.castShadow = true; roof.receiveShadow = true;
hallGroup.add(roof);
scene.add(hallGroup);

// ============================================================
// EXTENSION SYSTEM
// ============================================================
let extensions = [];
let extIdCounter = 1;

// État de dessin
let drawing = false;
let pivots = []; // {x, y, z}
let pivotMeshes = [];
let pivotLines = [];
let curveLine = null;
let pivotGroup = new THREE.Group();
scene.add(pivotGroup);

// Extension en cours d'édition
let editingExtId = null;
let editingPivots = [];

// Éléments UI
const statusText = document.getElementById('status-text');
const statusPivots = document.getElementById('status-pivots');
const extList = document.getElementById('ext-list');
const extEmpty = document.getElementById('ext-empty');
const btnNew = document.getElementById('btn-new-ext');
const btnCancel = document.getElementById('btn-cancel-ext');

// ============================================================
// FONCTIONS DE DESSIN DES PIVOTS
// ============================================================
function clearPivots() {
  pivotGroup.clear();
  pivotMeshes = [];
  pivotLines = [];
  curveLine = null;
}

function updatePivots() {
  clearPivots();
  if (pivots.length === 0) return;

  // Sphères
  pivots.forEach((p, i) => {
    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(0.5, 12, 12),
      new THREE.MeshStandardMaterial({
        color: i === 0 ? 0x4fae8f : 0xe0663f,
        emissive: 0xe0663f,
        emissiveIntensity: 0.15
      })
    );
    sphere.position.set(p.x, p.y, p.z);
    sphere.castShadow = true;
    pivotGroup.add(sphere);
    pivotMeshes.push(sphere);

    // Ligne verticale (hauteur)
    const lineMat = new THREE.LineBasicMaterial({ color: 0x4fae8f, transparent: true, opacity: 0.3 });
    const pts = [new THREE.Vector3(p.x, -0.4, p.z), new THREE.Vector3(p.x, p.y, p.z)];
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat);
    pivotGroup.add(line);
    pivotLines.push(line);

    // Étiquette de hauteur (texte simplifié via un petit repère)
    if (i > 0) {
      const arrow = new THREE.ArrowHelper(
        new THREE.Vector3(0, 1, 0),
        new THREE.Vector3(p.x, -0.2, p.z),
        0.3,
        0x4fae8f,
        0.2,
        0.1
      );
      pivotGroup.add(arrow);
    }
  });

  // Courbe
  if (pivots.length >= 2) {
    const pts = pivots.map(p => new THREE.Vector3(p.x, p.y, p.z));
    const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.3);
    const curvePts = curve.getPoints(50);
    const lineMat = new THREE.LineBasicMaterial({ color: 0x4fae8f, linewidth: 2 });
    const lineGeo = new THREE.BufferGeometry().setFromPoints(curvePts);
    curveLine = new THREE.Line(lineGeo, lineMat);
    pivotGroup.add(curveLine);
  }

  updateStatus();
}

function addPivot(x, y, z) {
  pivots.push({ x, y, z });
  updatePivots();
}

function removeLastPivot() {
  if (pivots.length > 1) {
    pivots.pop();
    updatePivots();
  }
}

function updateStatus() {
  if (drawing) {
    statusText.textContent = `✏️ Tracé en cours · ${pivots.length} pivot${pivots.length > 1 ? 's' : ''}`;
    statusPivots.textContent = pivots.length >= 2 ? '✅ Valider avec Entrée' : '⏳ Ajoutez au moins 2 pivots';
    btnNew.textContent = '✏️ Tracé en cours…';
    btnCancel.style.display = 'inline-block';
  } else if (editingExtId !== null) {
    statusText.textContent = `🔧 Édition de l'extension ${editingExtId}`;
    statusPivots.textContent = `${pivots.length} pivots · Entrée pour valider`;
    btnNew.textContent = '🔧 Édition…';
    btnCancel.style.display = 'inline-block';
  } else {
    const count = extensions.length;
    statusText.textContent = count ? `🏗️ ${count} extension${count > 1 ? 's' : ''} créée${count > 1 ? 's' : ''}` : '💡 Cliquez sur « Nouvelle extension »';
    statusPivots.textContent = '';
    btnNew.textContent = '➕ Nouvelle extension';
    btnCancel.style.display = 'none';
  }
  renderExtList();
}

// ============================================================
// CRÉATION DE L'EXTENSION (LOFT)
// ============================================================
function createExtensionFromPivots(pts, name) {
  if (pts.length < 2) return null;

  const curve = new THREE.CatmullRomCurve3(
    pts.map(p => new THREE.Vector3(p.x, p.y, p.z)),
    false, 'catmullrom', 0.3
  );
  const segments = 30;
  const profileW = 5;
  const profileH = 5;

  // Profil rectangulaire
  const profile = [
    new THREE.Vector3(-profileW/2, -profileH/2, 0),
    new THREE.Vector3(profileW/2, -profileH/2, 0),
    new THREE.Vector3(profileW/2, profileH/2, 0),
    new THREE.Vector3(-profileW/2, profileH/2, 0)
  ];
  const profLen = profile.length;

  const positions = [];
  const indices = [];

  for (let s = 0; s <= segments; s++) {
    const t = s / segments;
    const center = curve.getPointAt(t);
    const tangent = curve.getTangentAt(t);
    const up = new THREE.Vector3(0, 1, 0);
    const right = new THREE.Vector3().crossVectors(tangent, up).normalize();
    const localUp = new THREE.Vector3().crossVectors(right, tangent).normalize();

    for (const pp of profile) {
      const pt = center.clone()
        .add(right.clone().multiplyScalar(pp.x))
        .add(localUp.clone().multiplyScalar(pp.y));
      positions.push(pt.x, pt.y, pt.z);
    }
  }

  for (let s = 0; s < segments; s++) {
    for (let i = 0; i < profLen; i++) {
      const a = s * profLen + i;
      const b = s * profLen + ((i + 1) % profLen);
      const c = (s + 1) * profLen + i;
      const d = (s + 1) * profLen + ((i + 1) % profLen);
      indices.push(a, c, b, b, c, d);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();

  const mat = new THREE.MeshStandardMaterial({
    color: 0x9fb8c4,
    roughness: 0.5,
    metalness: 0.1,
    transparent: true,
    opacity: 0.85,
    side: THREE.DoubleSide
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);

  const ext = {
    id: extIdCounter++,
    name: name || `Extension ${extIdCounter-1}`,
    pivots: pts.map(p => ({ ...p })),
    mesh: mesh
  };
  extensions.push(ext);
  return ext;
}

// ============================================================
// ÉDITION D'UNE EXTENSION EXISTANTE
// ============================================================
function editExtension(id) {
  const ext = extensions.find(e => e.id === id);
  if (!ext) return;

  // Supprimer l'extension de la scène
  scene.remove(ext.mesh);
  ext.mesh.geometry.dispose();
  ext.mesh.material.dispose();
  extensions = extensions.filter(e => e.id !== id);

  // Passer en mode édition avec ses pivots
  editingExtId = id;
  pivots = ext.pivots.map(p => ({ ...p }));
  drawing = false;
  updatePivots();
  updateStatus();
  renderExtList();
}

function cancelEdit() {
  if (editingExtId !== null) {
    // Réajouter l'extension avec ses pivots actuels
    const ext = createExtensionFromPivots(pivots, `Extension ${editingExtId}`);
    if (ext) {
      ext.id = editingExtId;
      // Garder l'ID
      extensions = extensions.filter(e => e.id !== editingExtId);
      extensions.push(ext);
    }
    editingExtId = null;
    pivots = [];
    clearPivots();
    updateStatus();
    renderExtList();
  }
}

function finishEdit() {
  if (editingExtId !== null && pivots.length >= 2) {
    const ext = createExtensionFromPivots(pivots, `Extension ${editingExtId}`);
    if (ext) {
      ext.id = editingExtId;
      extensions = extensions.filter(e => e.id !== editingExtId);
      extensions.push(ext);
    }
    editingExtId = null;
    pivots = [];
    clearPivots();
    updateStatus();
    renderExtList();
  }
}

// ============================================================
// SUPPRESSION D'UNE EXTENSION
// ============================================================
function deleteExtension(id) {
  const ext = extensions.find(e => e.id === id);
  if (!ext) return;
  scene.remove(ext.mesh);
  ext.mesh.geometry.dispose();
  ext.mesh.material.dispose();
  extensions = extensions.filter(e => e.id !== id);
  renderExtList();
  updateStatus();
}

// ============================================================
// RENDU DE LA LISTE DANS LE PANNEAU
// ============================================================
function renderExtList() {
  extList.innerHTML = '';
  extEmpty.style.display = extensions.length ? 'none' : 'block';

  extensions.forEach(ext => {
    const card = document.createElement('div');
    card.className = 'bldg-card';
    card.style.borderColor = editingExtId === ext.id ? '#4fae8f' : '#2a3946';

    const head = document.createElement('div');
    head.className = 'bldg-head';

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = ext.name || `Extension ${ext.id}`;

    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = `${ext.pivots.length} pivots`;

    const editBtn = document.createElement('button');
    editBtn.className = 'mini-btn success';
    editBtn.textContent = '✎';
    editBtn.title = 'Modifier les pivots';
    editBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      editExtension(ext.id);
    });

    const delBtn = document.createElement('button');
    delBtn.className = 'mini-btn danger';
    delBtn.textContent = '✕';
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteExtension(ext.id);
    });

    head.append(name, badge, editBtn, delBtn);
    card.appendChild(head);
    extList.appendChild(card);
  });
}

// ============================================================
// INTERACTIONS UTILISATEUR
// ============================================================
// Démarrer une nouvelle extension
btnNew.addEventListener('click', () => {
  if (editingExtId !== null) {
    // Si on est en édition, on annule d'abord
    cancelEdit();
    return;
  }
  if (drawing) {
    // Si déjà en tracé, on annule
    cancelDrawing();
    return;
  }
  startDrawing();
});

btnCancel.addEventListener('click', () => {
  if (editingExtId !== null) {
    cancelEdit();
  } else if (drawing) {
    cancelDrawing();
  }
});

function startDrawing() {
  drawing = true;
  pivots = [];
  clearPivots();
  updatePivots();
  updateStatus();
  btnNew.textContent = '✏️ Tracé en cours…';
  btnCancel.style.display = 'inline-block';
  controls.enabled = false;
}

function cancelDrawing() {
  drawing = false;
  pivots = [];
  clearPivots();
  updateStatus();
  btnNew.textContent = '➕ Nouvelle extension';
  btnCancel.style.display = 'none';
  controls.enabled = true;
}

function finishDrawing() {
  if (pivots.length < 2) {
    statusText.textContent = '⚠️ Il faut au moins 2 pivots';
    return;
  }
  const ext = createExtensionFromPivots(pivots);
  if (ext) {
    statusText.textContent = `✅ Extension ${ext.id} créée !`;
  }
  drawing = false;
  pivots = [];
  clearPivots();
  updateStatus();
  btnNew.textContent = '➕ Nouvelle extension';
  btnCancel.style.display = 'none';
  controls.enabled = true;
  renderExtList();
}

// ============================================================
// ÉVÉNEMENTS SOURIS
// ============================================================
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function getGroundPoint(event) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(ground);
  return hits.length ? hits[0].point : null;
}

renderer.domElement.addEventListener('click', (event) => {
  if (event.button !== 0) return;

  if (drawing || editingExtId !== null) {
    const pt = getGroundPoint(event);
    if (pt) {
      // Hauteur par défaut : 2m, ou dernière hauteur si déjà des pivots
      let y = 2.0;
      if (pivots.length > 0) {
        y = pivots[pivots.length - 1].y;
      }
      addPivot(pt.x, y, pt.z);
    }
  }
});

// Double-clic pour ajuster la hauteur d'un pivot
renderer.domElement.addEventListener('dblclick', (event) => {
  if (!drawing && editingExtId === null) return;
  if (pivots.length === 0) return;

  // Trouver le pivot le plus proche du clic
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);

  const meshes = pivotMeshes;
  const hits = raycaster.intersectObjects(meshes);
  if (hits.length) {
    const idx = meshes.indexOf(hits[0].object);
    if (idx !== -1) {
      // Récupérer la hauteur actuelle du pivot
      const currentY = pivots[idx].y;
      // Proposer une nouvelle hauteur (clic sur le sol)
      const pt = getGroundPoint(event);
      if (pt) {
        pivots[idx].y = Math.max(0.5, pt.y);
        updatePivots();
        statusText.textContent = `📐 Pivot ${idx+1} → hauteur ${pivots[idx].y.toFixed(1)}m`;
      }
    }
  }
});

// ============================================================
// CLAVIER
// ============================================================
window.addEventListener('keydown', (event) => {
  if (event.key === 'Enter') {
    if (drawing) finishDrawing();
    else if (editingExtId !== null) finishEdit();
  }
  if (event.key === 'Escape') {
    if (drawing) cancelDrawing();
    else if (editingExtId !== null) cancelEdit();
  }
  if (event.key === 'Backspace' && drawing) {
    removeLastPivot();
  }
});

// ============================================================
// REDIMENSIONNEMENT
// ============================================================
function resize() {
  const w = viewport.clientWidth;
  const h = viewport.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', resize);

// ============================================================
// ANIMATION
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// ============================================================
// INIT
// ============================================================
updateStatus();
renderExtList();

console.log('🚀 Extension système prêt !');
console.log('💡 Cliquez sur "Nouvelle extension" puis sur le sol pour placer des pivots');
console.log('💡 Double-cliquez sur un pivot pour ajuster sa hauteur');
console.log('💡 Entrée : valider · Échap : annuler · Backspace : supprimer le dernier pivot');
</script>
